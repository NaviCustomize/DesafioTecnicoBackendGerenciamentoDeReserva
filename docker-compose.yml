version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: sistema-reservas-rabbitmq
    ports:
      - "5672:5672"    # AMQP port (producer/consumer)
      - "15672:15672"  # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

volumes:
  rabbitmq-data:
